# PocketDS settings: build options and where the releases go.
#
# Shell syntax (NAME=value). Read by scripts/build.sh, make-ota.sh and publish-release.sh.
# Order: this file < pocketds.local.conf (yours, not in git) < command-line options.
# To change something only on your machine, put the line in pocketds.local.conf.

# --- Releases -------------------------------------------------------------------------------
# GitHub repository (owner/name) that publishes the releases. The console looks for updates in
# its latest release, and the addresses written in update.json point to it.
RELEASE_REPO="Nolar-Hack/Ayaneo-PocketDS-Lineage-Releases"
# Address of update.json read by System update in PocketDS Extra. Empty: the latest release of
# RELEASE_REPO. Can still be changed in the app (System update > Update source).
UPDATE_URL=""
# Publish as a pre-release (the console does not see a pre-release as an update).
RELEASE_PRERELEASE=false
# Text of the release (markdown), relative to the folder of the project; %VERSION% is replaced.
# If the file is missing a short text is made from the packages.
RELEASE_NOTES="OTA/Patch Notes/release-notes-%VERSION%.md"

# --- Build ----------------------------------------------------------------------------------
# userdebug (default) | user | eng
VARIANT=userdebug
# Parallel jobs of the build and of repo sync
JOBS=8
SYNC_JOBS=8
# The build is throttled past MEM_HIGH and killed past MEM_MAX (not the desktop session)
MEM_HIGH=20G
MEM_MAX=25G
# Root: patch KernelSU Next into init_boot
KERNELSU=true
# Make the update packages (OTA/Full and OTA/Incremental) at the end of the build
MAKE_OTA=true
# mindthegapps (Google apps in the image) | none
GAPPS=mindthegapps
# Raise the version (YEAR.MONTH.BUILD) when a build starts
BUMP=true
# Check the tools, memory and disk before a build
CHECK=true
# Debug build: adb without authorization (first boot diagnosis only)
BRINGUP=false
# Devices the packages accept (a recovery answers with the board name)
OTA_ASSERT_DEVICES="PocketDS|kalama"
